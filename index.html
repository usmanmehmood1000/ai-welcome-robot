<!DOCTYPE html>
<html>
<head>

<title>AI Welcome Robot</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>

body {
    margin: 0;
    background: black;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#eyes {
    display: flex;
    gap: 120px;
    transition: transform 0.3s;
}

.eye {
    width: 180px;
    height: 260px;
    background: white;
    border-radius: 50%;
    position: relative;
    transition: height 0.15s ease, transform 0.2s ease;
}

.pupil {
    width: 70px;
    height: 110px;
    background: black;
    border-radius: 50%;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* BLINK */

.blink .eye {
    height: 20px;
    margin-top: 120px;
}

.blink .pupil {
    display: none;
}

/* HAPPY EYES */

.happy {
    transform: scale(1.12);
}

.happy .eye {
    transform: scale(1.05);
}

/* MESSAGE */

#message {
    position: fixed;
    bottom: 60px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 35px;
    font-family: Arial;
    display: none;
}

/* START BUTTON */

#start {
    position: fixed;
    bottom: 15px;
    padding: 12px 25px;
    font-size: 18px;
}

/* CAMERA */

#video {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
}

</style>

</head>

<body>

<!-- ROBOT EYES -->

<div id="eyes">

    <div class="eye">
        <div class="pupil"></div>
    </div>

    <div class="eye">
        <div class="pupil"></div>
    </div>

</div>


<!-- GREETING MESSAGE -->

<div id="message">

    Assalam-o-Alaikum!<br>

    Welcome to our KG Exhibition!

</div>


<!-- START BUTTON -->

<button id="start">

    START ROBOT

</button>


<!-- CAMERA -->

<video id="video" autoplay muted playsinline></video>


<!-- AUDIO -->

<audio id="welcomeAudio">

    <source src="welcome.mp3" type="audio/mpeg">

</audio>


<script>

let model;

let lastGreeting = 0;

let busy = false;


const video =
    document.getElementById("video");

const eyes =
    document.getElementById("eyes");

const message =
    document.getElementById("message");

const audio =
    document.getElementById("welcomeAudio");

const start =
    document.getElementById("start");


/* START ROBOT */

async function startRobot() {

    start.style.display = "none";

    const stream =
        await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: false

        });

    video.srcObject = stream;

    model = await cocoSsd.load();

    startBlinking();

    detectPerson();

}


/* BLINK */

function blink() {

    if (busy) return;

    eyes.classList.add("blink");

    setTimeout(() => {

        eyes.classList.remove("blink");

    }, 180);

}


/* RANDOM BLINKING */

function startBlinking() {

    function nextBlink() {

        const delay =
            Math.floor(Math.random() * 3000) + 3000;

        setTimeout(() => {

            blink();

            nextBlink();

        }, delay);

    }

    nextBlink();

}


/* AI PERSON DETECTION */

async function detectPerson() {

    const predictions =
        await model.detect(video);

    const personDetected =
        predictions.some(

            p =>
                p.class === "person" &&
                p.score > 0.55

        );


    if (

        personDetected &&

        !busy &&

        Date.now() - lastGreeting > 10000

    ) {

        greet();

    }


    requestAnimationFrame(detectPerson);

}


/* GREETING */

function greet() {

    busy = true;

    lastGreeting = Date.now();


    /* OPEN HAPPY EYES */

    eyes.classList.add("happy");


    /* SHOW MESSAGE */

    message.style.display = "block";


    /* PLAY AUDIO */

    audio.currentTime = 0;

    audio.play();


    /* RETURN TO NORMAL */

    setTimeout(() => {

        eyes.classList.remove("happy");

        message.style.display = "none";

        busy = false;

    }, 7000);

}


/* START BUTTON */

start.onclick = startRobot;

</script>

</body>
</html>

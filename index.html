<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Welcome Robot</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 35%,
        #5f7cff 0%,
        #3449b5 32%,
        #17224e 65%,
        #080b18 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Background glow */
body::before {
    content: "";
    position: absolute;
    width: 70vw;
    height: 70vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    background: rgba(100, 150, 255, 0.15);
    filter: blur(80px);
}

/* Floating particles */
.particle {
    position: absolute;
    width: 5px;
    height: 5px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: float 8s infinite ease-in-out;
}

.p1 { left: 10%; top: 20%; animation-delay: 0s; }
.p2 { left: 20%; top: 70%; animation-delay: 2s; }
.p3 { left: 80%; top: 25%; animation-delay: 1s; }
.p4 { left: 90%; top: 70%; animation-delay: 3s; }
.p5 { left: 50%; top: 10%; animation-delay: 4s; }

@keyframes float {
    0%,100% {
        transform: translateY(0);
        opacity: .4;
    }
    50% {
        transform: translateY(-25px);
        opacity: 1;
    }
}

/* Main robot */
.robot {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Eyes */
.eyes {
    display: flex;
    gap: clamp(35px, 8vw, 90px);
    align-items: center;
    justify-content: center;
    margin-bottom: 45px;
}

.eye {
    width: clamp(110px, 20vw, 210px);
    height: clamp(160px, 30vw, 280px);
    border-radius: 50%;
    background: linear-gradient(
        145deg,
        #ffffff,
        #e8f2ff
    );
    box-shadow:
        0 0 20px rgba(150,200,255,.9),
        0 0 50px rgba(80,150,255,.7),
        inset 0 0 30px rgba(100,170,255,.3);
    position: relative;
    overflow: hidden;
    transition: all .4s ease;
}

/* Pupils */
.pupil {
    width: 45%;
    height: 45%;
    background:
        radial-gradient(circle at 35% 30%,
        #ffffff 0%,
        #70a8ff 12%,
        #2765e8 45%,
        #071c63 100%);
    border-radius: 50%;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
        0 0 15px #4b8cff,
        0 0 35px rgba(60,130,255,.8);
    transition: all .3s ease;
}

/* Eye shine */
.pupil::after {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: white;
    left: 20%;
    top: 17%;
}

/* Natural blinking */
.eye.blink {
    animation: blink .18s ease-in-out;
}

@keyframes blink {
    0% { transform: scaleY(1); }
    50% { transform: scaleY(.08); }
    100% { transform: scaleY(1); }
}

/* Happy expression */
.happy .eye {
    height: clamp(100px, 18vw, 170px);
    border-radius: 50% 50% 35% 35%;
}

.happy .pupil {
    transform: translate(-50%, -35%) scale(1.15);
}

/* Welcome message */
.message {
    font-size: clamp(25px, 5vw, 55px);
    font-weight: bold;
    text-align: center;
    line-height: 1.25;
    opacity: 0;
    transform: translateY(20px);
    transition: all .5s ease;
    text-shadow:
        0 0 15px rgba(255,255,255,.6),
        0 0 35px rgba(100,170,255,.7);
    padding: 0 20px;
}

.happy .message {
    opacity: 1;
    transform: translateY(0);
}

/* Start button */
#startButton {
    margin-top: 30px;
    padding: 16px 38px;
    border: none;
    border-radius: 40px;
    background: white;
    color: #1d3aa5;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        0 0 20px rgba(255,255,255,.6),
        0 0 40px rgba(100,150,255,.5);
    transition: all .25s ease;
    z-index: 20;
}

#startButton:hover {
    transform: scale(1.05);
}

#startButton:active {
    transform: scale(.97);
}

/* Status */
#status {
    position: fixed;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    opacity: .75;
    z-index: 10;
}

/* Hidden camera */
video {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

/* Mobile */
@media (max-width: 600px) {

    .eyes {
        gap: 25px;
        margin-bottom: 35px;
    }

    .eye {
        width: 100px;
        height: 145px;
    }

    .happy .eye {
        height: 95px;
    }

    .message {
        font-size: 26px;
    }

    #startButton {
        font-size: 17px;
        padding: 14px 30px;
    }
}
</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

<div class="robot" id="robot">

    <div class="eyes">

        <div class="eye">
            <div class="pupil"></div>
        </div>

        <div class="eye">
            <div class="pupil"></div>
        </div>

    </div>

    <div class="message">
        Assalam-o-Alaikum!<br>
        Welcome to our KG Exhibition!
    </div>

    <button id="startButton">
        START ROBOT
    </button>

</div>

<div id="status">
    Tap START ROBOT to activate AI detection
</div>

<video id="video" autoplay playsinline muted></video>

<audio id="welcomeAudio" preload="auto">
    <source src="welcome.mp3" type="audio/mpeg">
</audio>

<script>

const robot = document.getElementById("robot");
const video = document.getElementById("video");
const audio = document.getElementById("welcomeAudio");
const startButton = document.getElementById("startButton");
const statusText = document.getElementById("status");

let model = null;
let lastGreeting = 0;
let audioUnlocked = false;
let robotStarted = false;

/* --------------------------------------------------
   AUDIO UNLOCK
-------------------------------------------------- */

async function unlockAudio() {

    try {

        audio.currentTime = 0;
        audio.volume = 1;
        audio.muted = false;

        /*
        This play happens directly after the user's
        START ROBOT tap, which gives the browser a
        user-gesture permission for audio.
        */

        await audio.play();

        /*
        Immediately pause it.
        The important part is that play() was triggered
        by the user's actual tap.
        */

        audio.pause();
        audio.currentTime = 0;

        audioUnlocked = true;

        console.log("Audio unlocked successfully");

    } catch (error) {

        console.log("Audio unlock error:", error);
        audioUnlocked = false;

    }
}


/* --------------------------------------------------
   START ROBOT
-------------------------------------------------- */

async function startRobot() {

    if (robotStarted) return;

    robotStarted = true;

    startButton.style.display = "none";

    statusText.innerText = "Starting AI camera...";

    /*
    Unlock audio first.
    */

    await unlockAudio();

    /*
    Request camera.
    */

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        statusText.innerText = "Loading AI vision...";

    } catch (error) {

        statusText.innerText =
            "Camera permission is required.";

        console.error(error);

        return;
    }

    /*
    Load AI model.
    */

    try {

        model = await cocoSsd.load();

        statusText.innerText =
            "AI Robot Active — waiting for visitors";

        detectPeople();

    } catch (error) {

        statusText.innerText =
            "Could not load AI model.";

        console.error(error);
    }

}


/* --------------------------------------------------
   AI PERSON DETECTION
-------------------------------------------------- */

async function detectPeople() {

    if (!model || video.readyState < 2) {

        requestAnimationFrame(detectPeople);
        return;
    }

    try {

        const predictions =
            await model.detect(video);

        const personDetected =
            predictions.some(function(prediction) {

                return (
                    prediction.class === "person" &&
                    prediction.score > 0.55
                );

            });

        if (personDetected) {

            const now = Date.now();

            /*
            Wait 10 seconds before another greeting.
            */

            if (now - lastGreeting > 10000) {

                greet();

                lastGreeting = now;
            }
        }

    } catch (error) {

        console.log(error);

    }

    requestAnimationFrame(detectPeople);
}


/* --------------------------------------------------
   GREETING
-------------------------------------------------- */

async function greet() {

    robot.classList.add("happy");

    statusText.innerText =
        "Visitor detected — greeting...";

    /*
    Try to play the welcome message.
    */

    try {

        audio.currentTime = 0;
        audio.volume = 1;
        audio.muted = false;

        await audio.play();

        audioUnlocked = true;

        console.log("Greeting audio played");

    } catch (error) {

        console.log(
            "Automatic audio playback blocked:",
            error
        );

        /*
        Try one more time after a tiny delay.
        */

        setTimeout(async function() {

            try {

                audio.currentTime = 0;
                await audio.play();

            } catch (error2) {

                console.log(
                    "Second audio attempt blocked:",
                    error2
                );

            }

        }, 100);

    }

    /*
    Return to normal after 7 seconds.
    */

    setTimeout(function() {

        robot.classList.remove("happy");

        statusText.innerText =
            "AI Robot Active — waiting for visitors";

    }, 7000);

}


/* --------------------------------------------------
   NATURAL BLINKING
-------------------------------------------------- */

function blinkEyes() {

    const eyes =
        document.querySelectorAll(".eye");

    eyes.forEach(function(eye) {

        eye.classList.add("blink");

        setTimeout(function() {

            eye.classList.remove("blink");

        }, 180);

    });

    /*
    Random next blink.
    */

    const nextBlink =
        2500 + Math.random() * 4000;

    setTimeout(blinkEyes, nextBlink);
}


/* --------------------------------------------------
   START BUTTON
-------------------------------------------------- */

startButton.addEventListener(
    "click",
    startRobot
);


/* --------------------------------------------------
   START NATURAL BLINKING
-------------------------------------------------- */

setTimeout(blinkEyes, 2000);

</script>

</body>
</html>
